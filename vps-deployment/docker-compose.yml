# ==============================================================================
# Graven Flow - Supabase Production Docker Compose Stack
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database (Supabase Postgres with all extensions)
  # ----------------------------------------------------------------------------
  db:
    image: supabase/postgres:15.6.1.137
    container_name: graven-postgres
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET:?Required}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./flow-whisper-79_260924.backup:/backup:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------------------------------------------------------------------------
  # Kong API Gateway (Unified API endpoint on port 8000)
  # ----------------------------------------------------------------------------
  kong:
    image: kong:2.8.1
    container_name: graven-kong
    restart: unless-stopped
    ports:
      - "${KONG_PORT:-8088}:8000"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./kong.yml:/var/lib/kong/kong.yml:ro
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # GoTrue (Supabase Auth)
  # ----------------------------------------------------------------------------
  auth:
    image: supabase/gotrue:v2.158.1
    container_name: graven-auth
    restart: unless-stopped
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-*}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Required}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # PostgREST (Auto-generated REST API from PostgreSQL)
  # ----------------------------------------------------------------------------
  rest:
    image: postgrest/postgrest:v12.2.0
    container_name: graven-postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public,storage}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?Required}
      PGRST_DB_USE_BUILTIN_AUTH: "false"
      PGRST_SERVER_PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Supabase Realtime (WebSocket pub/sub)
  # ----------------------------------------------------------------------------
  realtime:
    image: supabase/realtime:v2.30.23
    container_name: graven-realtime
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_SSL: "false"
      PORT_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Required}
      REPLICATION_MODE: RLS
      REPLICATION_POLL_INTERVAL: 100
      SECURE_CHANNELS: "true"
      SLOT_NAME: supabase_realtime_rls
      TEMPORARY_SLOT: "true"
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Supabase Storage (File Storage & Buckets)
  # ----------------------------------------------------------------------------
  storage:
    image: supabase/storage-api:v1.11.13
    container_name: graven-storage
    restart: unless-stopped
    environment:
      ANON_KEY: ${ANON_KEY:?Required}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?Required}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET:?Required}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: default
      REGION: local
      GLOBAL_S3_BUCKET: default
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
    volumes:
      - storage-data:/var/lib/storage
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started

  # ----------------------------------------------------------------------------
  # Supabase Studio (Admin Database UI on port 3000)
  # ----------------------------------------------------------------------------
  studio:
    image: supabase/studio:2026.09.21-sha-512201d
    container_name: graven-studio
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT:-3000}:3000"
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      SUPABASE_ANON_KEY: ${ANON_KEY:?Required}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?Required}
    depends_on:
      meta:
        condition: service_started

  # ----------------------------------------------------------------------------
  # Postgres Meta (Schema introspection for Studio)
  # ----------------------------------------------------------------------------
  meta:
    image: supabase/postgres-meta:v0.84.1
    container_name: graven-postgres-meta
    restart: unless-stopped
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      PG_META_DB_SSL_MODE: disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  storage-data:
