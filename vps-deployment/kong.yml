_format_version: "2.1"
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: ${ANON_KEY}
  - username: service_role
    keyauth_credentials:
      - key: ${SERVICE_ROLE_KEY}

services:
  # Auth Service
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/

  # REST API (PostgREST)
  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/

  # Realtime Service
  - name: realtime-v1
    url: http://realtime:4000/socket
    routes:
      - name: realtime-v1-all
        strip_path: true
        paths:
          - /realtime/v1/

  # Storage Service
  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/

  # Edge Functions Service
  - name: functions-v1
    url: http://functions:9000/
    routes:
      - name: functions-v1-all
        strip_path: true
        paths:
          - /functions/v1/

plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - HEAD
        - PUT
        - PATCH
        - POST
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Authorization
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - ApiKey
        - X-Client-Info
        - x-client-info
        - X-Requested-With
        - Prefer
        - prefer
        - Range
        - range
        - apikey
        - X-Supabase-Api-Version
        - x-supabase-api-version
        - X-Razorpay-Signature
        - x-razorpay-signature
        - Accept-Profile
        - accept-profile
        - Content-Profile
        - content-profile
        - X-Upsert
        - x-upsert
      exposed_headers:
        - Content-Range
        - X-Total-Count
        - Content-Profile
        - content-profile
        - Accept-Profile
        - accept-profile
      max_age: 3600
      credentials: true

